openapi: 3.0.3
info:
  title: Complete On-Page SEO 2026 API
  version: 1.3.0
  description: >-
    Production-grade 22-level on-page + AI-search (RAG/LLM) SEO audit engine.
    Real measured data, no mocks. See GET /api/health for liveness.
  contact:
    name: Dipak Jadhav
    url: https://github.com/dipakjad1993/Complete-On-Page-SEO
servers:
  - url: https://complete-on-page-seo.onrender.com
    description: Render (public demo, sleeps when idle)
  - url: http://localhost:3000
    description: Local dev
paths:
  /api/health:
    get:
      summary: Liveness probe (version, levels=22, cache, history)
      responses:
        '200':
          description: ok
  /api:
    get:
      summary: API index (13 paths)
      responses:
        '200':
          description: endpoint list
  /api/audit:
    post:
      summary: Run full 22-level audit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  example: https://example.com
                auditId:
                  type: string
                config:
                  type: object
                  properties:
                    keywords:
                      type: string
                    brand:
                      type: string
                    pageType:
                      type: string
                    userAgent:
                      type: string
                    customUA:
                      type: string
                    viewportWidth:
                      type: integer
                      minimum: 320
                      maximum: 3840
                    viewportHeight:
                      type: integer
                      minimum: 320
                      maximum: 2160
                    monthlyTraffic:
                      type: number
                      minimum: 0
                    avgOrderValue:
                      type: number
                      minimum: 0
                    conversionRate:
                      type: number
                      minimum: 0
                      maximum: 100
                    currency:
                      type: string
                    geo:
                      type: string
                    sitemap:
                      type: string
                    competitors:
                      type: string
            examples:
              basic:
                value: { url: 'https://example.com', config: { keywords: 'seo audit' } }
              revenue:
                value:
                  url: 'https://example.com/product'
                  config: { monthlyTraffic: 50000, avgOrderValue: 75, conversionRate: 2.5, currency: USD }
      responses:
        '200':
          description: audit result (22 levels + overallScore + weightedScore + summary + meta + history-recorded)
        '400':
          description: invalid URL or blocked private host (SSRF guard)
        '429':
          description: engine busy, retry with Retry-After
  /api/audit-progress/{auditId}:
    get:
      summary: SSE progress stream (heartbeat every 20s)
      parameters:
        - in: path
          name: auditId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: text/event-stream
  /api/analyze-url:
    post:
      summary: Auto-fill config (brand, pageType, keywords, competitors, geo, currency)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
      responses:
        '200':
          description: auto-fill result
        '400':
          description: invalid / private URL
  /api/crawl:
    post:
      summary: Same-origin BFS crawl (max 25 pages) + sitemap expansion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startUrl]
              properties:
                startUrl:
                  type: string
                maxPages:
                  type: integer
                  minimum: 1
                  maximum: 25
                includeSitemap:
                  type: boolean
                  default: true
      responses:
        '200':
          description: crawled page list
  /api/crux:
    get:
      summary: CrUX/PageSpeed field data (LCP, INP, CLS; PAGESPEED_API_KEY for quota)
      parameters:
        - in: query
          name: url
          required: true
          schema:
            type: string
      responses:
        '200':
          description: field metrics (or honest unmeasured payload)
        '429':
          description: PageSpeed quota exceeded
  /api/history:
    get:
      summary: Audit history (file-backed, last 200)
      parameters:
        - in: query
          name: url
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: count + entries
  /api/diff:
    get:
      summary: Diff two audits for one URL (timestamps from /api/history)
      parameters:
        - in: query
          name: url
          required: true
          schema:
            type: string
        - in: query
          name: from
          required: true
          schema:
            type: string
        - in: query
          name: to
          required: true
          schema:
            type: string
      responses:
        '200':
          description: overallDelta + verdict + per-level deltas
        '404':
          description: timestamps not found
  /api/export-pdf:
    post:
      summary: Render HTML report to PDF (max 1MB HTML)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [html]
              properties:
                html:
                  type: string
      responses:
        '200':
          description: application/pdf
  /api/cache-stats:
    get:
      summary: LRU cache + concurrency stats (size/max/ttl/hits/misses/evictions/hitRate)
      responses:
        '200':
          description: stats
