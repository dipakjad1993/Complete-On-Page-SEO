name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.3.0). Must already exist; workflow rebuilds artifacts from it.'
        required: true
        default: 'v1.3.0'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Publish to npm (skips cleanly when NPM_TOKEN secret is absent)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret not set — skipping npm publish."
            exit 0
          fi
          npm publish --access public
      - name: Build + push Docker to GHCR
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          TAG="${RELEASE_TAG#v}"
          # GHCR repository paths must be lowercase; github.repository preserves case
          REPO_LOWER="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          docker build -t "ghcr.io/${REPO_LOWER}:${TAG}" -t "ghcr.io/${REPO_LOWER}:latest" .
          docker push "ghcr.io/${REPO_LOWER}:${TAG}"
          docker push "ghcr.io/${REPO_LOWER}:latest"
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
