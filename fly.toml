# Fly.io alternative (512MB + persistent Chrome, no sleep). Use if Render free tier keeps 503ing.
# Deploy: fly launch && fly deploy  (requires fly.toml + Dockerfile)
app = "complete-on-page-seo"
primary_region = "iad"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
